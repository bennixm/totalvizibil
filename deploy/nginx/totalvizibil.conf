# Totalvizibil — production nginx site config.
#
# Managed here in git; deployed to /etc/nginx/sites-available/totalvizibil.conf
# on the VPS and symlinked into sites-enabled. The SSL server block + the
# HTTP->HTTPS redirect block below were added by `certbot --nginx -d
# totalvizibil.ro -d www.totalvizibil.ro --expand --redirect` running
# directly on the server (the lines tagged "# managed by Certbot") — this
# copy was re-synced from the live file afterward so git stays the source of
# truth instead of silently drifting, like the previous VPS's config did. If
# certbot ever renews onto a new cert path or touches this file again, pull
# a fresh copy the same way: `cat /etc/nginx/sites-enabled/totalvizibil.conf`
# on the server, paste back here.
#
# Serves:
#   - the built frontend SPA (project/frontend/dist) at /
#   - the NestJS API (PM2 process "tvz-api", listening on 127.0.0.1:3000,
#     global prefix /api/v1 — see project/backend/src/main.ts) at /api/
#
# The COOP/COEP headers on `location /` are required SITE-WIDE (not just
# /website/builder) for the Website Builder's WebContainer sandbox — see
# deploy/nginx/website-builder-headers.conf for the full "why", and
# memory/webcontainer-coep-spa-routing-gotcha for the incident that happens
# if this is ever re-scoped to a single path again.

server {
    server_name totalvizibil.ro www.totalvizibil.ro;

    root /var/www/totalvizibil/project/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;

        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/totalvizibil.ro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/totalvizibil.ro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.totalvizibil.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = totalvizibil.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name totalvizibil.ro www.totalvizibil.ro;
    return 404; # managed by Certbot
}
