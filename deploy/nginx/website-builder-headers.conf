# Website Builder — required response headers for the WebContainer sandbox.
#
# The Website Builder's live preview runs on StackBlitz's WebContainer API,
# which boots an in-browser Node.js runtime backed by SharedArrayBuffer. The
# browser only grants that when the DOCUMENT is served cross-origin-isolated,
# i.e. self.crossOriginIsolated === true, which requires:
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Embedder-Policy: credentialless
# Without them, WebContainer.boot() hangs forever — the sandbox status stays
# on "Starting the sandbox…" and never advances, and the browser console
# shows "DataCloneError: ... SharedArrayBuffer transfer requires
# self.crossOriginIsolated."
#
# --- Why this is NOT scoped to /website/builder ---
# An earlier version of this file added these headers only to a
# `location /website/builder { ... }` block. That does NOT work in practice:
# self.crossOriginIsolated is decided once, at the browser's initial
# navigation to a document, and never changes afterward. /website/builder is
# a normal client-side Vue Router route (createWebHistory) — every real entry
# point (DashboardView, CampaignView, CreateUnlockView, ...) reaches it via
# <router-link>/router.push(), which is a same-document pushState, NOT a
# fresh HTTP request. So the /website/builder location block's headers only
# ever apply if a user types that exact URL, hard-refreshes on it, or opens
# it in a new tab — everyone who clicks through from inside the app gets a
# document that was actually served from wherever they started (e.g. "/" or
# "/dashboard"), which never carried these headers, so isolation is false for
# the rest of that page's lifetime. This is why the scoped fix appeared not
# to work even after being deployed correctly.
#
# The fix: apply these headers to EVERY response that can serve the SPA
# shell (i.e. every app route), not just one path.
#
# --- Why credentialless, not require-corp ---
# COEP: require-corp requires every cross-origin resource loaded ANYWHERE in
# the app (Leaflet's OpenStreetMap tiles on the location step, hotlinked
# Pexels images on a published site, etc.) to opt in via CORP/CORS, or the
# browser blocks them outright. Auditing/proxying every such resource
# site-wide is a much bigger change than this bug warrants.
# COEP: credentialless still yields self.crossOriginIsolated === true (which
# is all WebContainer needs), but only strips credentials from cross-origin
# no-cors loads instead of blocking them — none of this app's existing
# cross-origin resources need credentials, so nothing else changes.
# `WebContainer.boot()` is called with `coep: 'credentialless'` on the
# frontend (src/lib/webcontainer.ts) to match — the two must agree.
# Caveat: credentialless has slightly narrower browser support than
# require-corp (solid on Chromium/Edge; check current Firefox/Safari support
# before relying on this for a Safari-heavy audience). If that ever becomes a
# blocker, the alternative is require-corp site-wide PLUS auditing every
# cross-origin resource the app loads to add CORP headers or proxy them
# same-origin — a materially bigger change, not a one-line swap.
#
# --- How to use ---
# This is a reference snippet, not applied automatically by the deploy
# pipeline (project/.github/workflows/deploy.yml only builds the frontend;
# it does not manage nginx). Add the two `add_header` lines below into the
# EXISTING location block on the VPS that serves project/frontend/dist and
# does `try_files $uri $uri/ /index.html` for the whole app (typically
# `location /`) — do not create a separate location for /website/builder.
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify afterward with:
#   curl -sI https://yourdomain/  | grep -i cross-origin
#   curl -sI https://yourdomain/website/builder | grep -i cross-origin
# Both must show both headers. Then in a real browser: hard-load the SITE'S
# HOME PAGE (not the builder URL directly), click through to the Website
# Builder via the normal in-app link, open devtools console, and confirm
# `self.crossOriginIsolated` is `true` BEFORE checking the builder itself —
# that's the case the old scoped fix silently failed on.

location / {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    try_files $uri $uri/ /index.html;
}
