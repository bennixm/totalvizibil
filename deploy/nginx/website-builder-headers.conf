# Website Builder — required response headers for the WebContainer sandbox.
#
# The Website Builder's live preview runs on StackBlitz's WebContainer API,
# which boots an in-browser Node.js runtime backed by SharedArrayBuffer. The
# browser only grants that when the DOCUMENT is served cross-origin-isolated,
# i.e. the /website/builder page response carries both:
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Embedder-Policy: require-corp
# Without them, WebContainer.boot() hangs forever — the sandbox status stays
# on "Starting the sandbox…" and never advances, because the browser never
# resolves the isolation check the API is waiting on.
#
# This is NOT something the built frontend (project/frontend/dist) or the
# NestJS backend can set on its own in production — both are static files /
# an API server, neither owns the HTTP response for the SPA's document
# request. It has to be set by whatever serves project/frontend/dist (nginx,
# in the standard deployment for this app).
#
# `vite dev` already does this locally via the `crossOriginIsolatedForWebsiteBuilder`
# plugin in project/frontend/vite.config.ts — this file is the production
# equivalent of that same plugin, scoped the same way and for the same reason:
# these headers are ONLY added for /website/builder, never site-wide. Adding
# COEP: require-corp globally would break every other page that loads a
# cross-origin resource without an explicit CORP/CORS opt-in — e.g. Leaflet's
# OpenStreetMap tiles on the location step, and hotlinked Pexels images on a
# published site — since COEP blocks any cross-origin no-cors load that
# doesn't opt in.
#
# --- How to use ---
# This is a reference snippet, not applied automatically by the deploy
# pipeline (project/.github/workflows/deploy.yml only builds the frontend;
# it does not manage nginx). Add the `location` block below into the existing
# server block that serves project/frontend/dist on the VPS, alongside
# whatever SPA fallback and /api/ proxy_pass it already has, then:
#   sudo nginx -t && sudo systemctl reload nginx

location /website/builder {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Same SPA fallback the rest of the app uses — this route is rendered
    # client-side by Vue Router, there is no real file at this path.
    try_files $uri $uri/ /index.html;
}
